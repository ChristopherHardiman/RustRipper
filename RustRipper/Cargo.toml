[package]
name = "rust_ripper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
udev = "0.7.0"
toml = "0.7.3"
reqwest = { version = "0.11.17", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.162", features = ["derive"] }
serde_json = "1.0"

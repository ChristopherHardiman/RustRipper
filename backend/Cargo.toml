[package]
name = "rustripper-backend"
version = "0.1.0"
edition = "2021"
authors = ["Christopher Hardiman"]

[dependencies]
# Workspace crates
rustripper-core = { path = "../crates/core" }
rustripper-disc = { path = "../crates/disc" }
rustripper-metadata = { path = "../crates/metadata" }
rustripper-ripper = { path = "../crates/ripper" }
rustripper-transcode = { path = "../crates/transcode" }

# Web server
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"

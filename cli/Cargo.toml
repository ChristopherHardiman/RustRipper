[package]
name = "rustripper-cli"
version = "0.1.0"
edition = "2021"
authors = ["Christopher Hardiman"]

[[bin]]
name = "rustripper"
path = "src/main.rs"

[dependencies]
# Workspace crates
rustripper-core = { path = "../crates/core" }
rustripper-disc = { path = "../crates/disc" }
rustripper-metadata = { path = "../crates/metadata" }
rustripper-ripper = { path = "../crates/ripper" }
rustripper-transcode = { path = "../crates/transcode" }

# CLI dependencies
clap = { version = "4.5", features = ["derive", "color"] }
indicatif = "0.17"
colored = "2.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
shellexpand = "3.1"
